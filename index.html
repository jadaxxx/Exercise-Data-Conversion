<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSV to JSON</title>
</head>
<body>

<h1>Jaden Charles A. Dacanay</h1>
<h3><i>IT 3206N MMW 12:30-3:00PM</i></h3>

<br><br>

<h1>CSV to JSON</h1>

<h2>1. Upload CSV</h2>
<input type="file" id="csvFile" accept=".csv">
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
<button id="convertBtn">Convert CSV to JSON</button>

<h2>2. JSON Display</h2>
<pre id="output">Upload a CSV file and click Convert CSV to JSON.</pre>

<h2>3. Download JSON File</h2>
<button id="downloadBtn">Download JSON</button>

<script>
const PROGRAMS = {
  BSIT: 'Bachelor of Science in Information Technology',
  BSCS: 'Bachelor of Science in Computer Science'
};

let jsonText = '';

const capitalize = s => s.toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase());

function parseCSV(text) {
  const rows = [];
  let row = [], field = '', quoted = false;
  text = text.replace(/^\uFEFF/, '');

  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') quoted = false;
      else field += c;
    } else if (c === '"') quoted = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field); field = '';
      rows.push(row); row = [];
    } else field += c;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ''));
}

function convert(text) {
  const [header, ...data] = parseCSV(text);
  const cols = header.map(h => h.trim());

  const records = data.map(r => {
    const o = {};
    cols.forEach((c, i) => o[c] = (r[i] || '').trim());
    return {
      studentId: parseInt(o.student_id, 10),
      firstName: capitalize(o.first_name),
      lastName: capitalize(o.last_name),
      program: PROGRAMS[o.course.toUpperCase()] || o.course,
      yearLevel: parseInt(o.year_level, 10),
      emailAddress: o.email.toLowerCase(),
      outstandingBalance: (parseFloat(o.tuition_balance) || 0).toFixed(2)
    };
  });


  return JSON.stringify(records, null, 2)
    .replace(/("outstandingBalance": )"([\d.]+)"/g, '$1$2');
}

document.getElementById('convertBtn').addEventListener('click', () => {
  const file = document.getElementById('csvFile').files[0];
  const out = document.getElementById('output');

  if (!file) { out.textContent = 'Please choose a CSV file first.'; return; }

  const reader = new FileReader();
  reader.onload = () => {
    try {
      jsonText = convert(reader.result);
      out.textContent = jsonText;
    } catch (err) {
      jsonText = '';
      out.textContent = 'Could not convert the file. Check that it is a valid CSV.';
    }
  };
  reader.readAsText(file);
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  if (!jsonText) { alert('Convert a CSV file first.'); return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([jsonText], { type: 'application/json' }));
  a.download = 'students.json';
  a.click();
  URL.revokeObjectURL(a.href);
});
</script>

</body>
</html>
